[project]
name = "ones-agent"
version = "0.2.0"
description = "ONES ↔ Git 自动化开发 Agent - 缺陷监控、LLM 规划、自动编码、CI/CD 反馈"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "prometheus-client>=0.20",
    "litellm>=1.0",
    "gitpython>=3.1",
    "fastmcp>=2.0",
    "pycryptodome>=3.23",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "openai>=1.0",
    "pyjwt>=2.12.1",
    "aiosmtplib>=5.1.0",
    "jsonschema>=4.0",
    "textual>=0.89,<2",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "respx>=0.21", "pytest-asyncio>=0.23", "graphql-core>=3.2"]

[project.scripts]
ones-agent = "server:mcp.run"
ones-dev = "src.developer_workflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.setuptools]
py-modules = ["server", "main"]
include-package-data = false

[tool.setuptools.package-data]
"src.developer_workflow" = ["schemas/*.json", "tui/*.tcss"]
"src.llm" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ones_lan: read-only tests against the authorized LAN ONES deployment",
]
